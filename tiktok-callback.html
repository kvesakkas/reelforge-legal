<title>ReelForge – back from TikTok</title>
<link rel="stylesheet" href="style.css">
<script>
  // Only used if TikTok refuses ReelForge's own (private, ts.net) Redirect URI: TikTok sends the
  // browser here with ?code=…&state=…, and this page passes them on to ReelForge on Kyriacos's
  // private network. Nothing is stored here; the code is useless without ReelForge's PKCE verifier.
  location.replace("https://reelforge.tail87ad84.ts.net/api/oauth/tiktok/callback" + location.search);
</script>
</head>
<body>
<main>
<p>Going back to ReelForge… This only works on Kyriacos's own devices.</p>
</main>
</body>
